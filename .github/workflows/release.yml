# Push a tag like v0.2.0 and this builds a signed release APK and publishes it as a GitHub release.
# Every release is signed with the same key, so each one installs over the one before (and over
# debug builds made with that key on your computer).
#
# Needs two repository secrets:
#   SCROLLWERK_KEYSTORE_BASE64    base64 of ~/.android/scrollwerk-release.jks
#   SCROLLWERK_KEYSTORE_PASSWORD  its password (also the key's)
name: Release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version code is the commit count; the name comes from the tag
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Unpack the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SCROLLWERK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::The SCROLLWERK_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build
        env:
          SCROLLWERK_KEYSTORE: ${{ runner.temp }}/release.jks
          SCROLLWERK_KEYSTORE_PASSWORD: ${{ secrets.SCROLLWERK_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          apk="scrollwerk-${TAG#v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release create "$TAG" "$apk" "$apk.sha256" --title "Scrollwerk ${TAG#v}" --generate-notes --verify-tag

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
